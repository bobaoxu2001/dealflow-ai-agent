[project]
name = "dealflow-ai-agent"
version = "0.1.0"
description = "LangGraph-powered enterprise CRM workflow agent for opportunity review and human-approved CRM writeback."
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "UP", "B"]
ignore = [
    "B008",  # FastAPI Depends() in argument defaults is idiomatic
    "E501",  # line length is enforced by the formatter, not the linter
]
