name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: full offline test suite on the zero-infra SQLite path.
  # ---------------------------------------------------------------------------
  test-sqlite:
    name: tests (sqlite, full offline suite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check app scripts tests

      - name: Import check
        run: python -c "import app.main; import app.agents.graph; print('imports OK')"

      - name: Run tests
        env:
          DATABASE_URL: "sqlite:///./ci_test.db"
          EMBEDDING_PROVIDER: local
        run: pytest -q

  # ---------------------------------------------------------------------------
  # Job 2: native PostgreSQL + pgvector integration path.
  # Verifies the database actually runs the pgvector `<=>` operator, not the
  # SQLite Python fallback. Uses the demo seed (no Kaggle download in CI).
  # ---------------------------------------------------------------------------
  test-postgres:
    name: integration (postgres + pgvector)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: dealflow
          POSTGRES_PASSWORD: dealflow
          POSTGRES_DB: dealflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dealflow"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: "postgresql+psycopg2://dealflow:dealflow@localhost:5432/dealflow"
      EMBEDDING_PROVIDER: local
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pgvector integration tests
        run: pytest tests/integration -q
